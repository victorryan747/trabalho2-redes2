<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chat WebSockets - Exercício 10</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 15px; }
        #chat-box { border: 1px solid #ccc; height: 320px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .msg { margin: 4px 0; }
        .propia { color: #0056b3; font-weight: bold; }
        .sistema { color: #666; font-style: italic; }
        .controles { display: flex; gap: 8px; margin-bottom: 10px; }
        input[type="text"] { flex: 1; padding: 8px; }
        button { padding: 8px 14px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Chat em Tempo Real (WebSockets)</h2>

    <div class="controles" id="painel-conexao">
        <input type="text" id="username" placeholder="Seu nome de usuário">
        <input type="text" id="url" value="ws://127.0.0.1:8765">
        <button onclick="conectar()">Conectar</button>
    </div>

    <div id="chat-box"></div>

    <div class="controles">
        <input type="text" id="mensagem" placeholder="Digite uma mensagem..." disabled onkeydown="if(event.key==='Enter') enviar()">
        <button id="btn-enviar" onclick="enviar()" disabled>Enviar</button>
    </div>

    <script>
        let ws = null;
        let usuarioAtual = "";

        function adicionarMensagem(texto, classe = "") {
            const box = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = "msg " + classe;
            div.textContent = texto;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function conectar() {
            const inputUser = document.getElementById("username");
            const url = document.getElementById("url").value.trim();
            usuarioAtual = inputUser.value.trim();

            if (!usuarioAtual) {
                alert("Informe um nome de usuário.");
                return;
            }

            ws = new WebSocket(url);

            ws.onopen = () => {
                ws.send(usuarioAtual);
                adicionarMensagem("[SISTEMA] Conectado ao servidor como " + usuarioAtual, "sistema");
                document.getElementById("mensagem").disabled = false;
                document.getElementById("btn-enviar").disabled = false;
                document.getElementById("painel-conexao").style.display = "none";
            };

            ws.onmessage = (evento) => {
                adicionarMensagem(evento.data);
            };

            ws.onclose = () => {
                adicionarMensagem("[SISTEMA] Desconectado do servidor.", "sistema");
                document.getElementById("mensagem").disabled = true;
                document.getElementById("btn-enviar").disabled = true;
            };

            ws.onerror = () => {
                adicionarMensagem("[ERRO] Falha na conexão WebSocket.", "sistema");
            };
        }

        function enviar() {
            const inputMsg = document.getElementById("mensagem");
            const texto = inputMsg.value.trim();
            if (texto && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(texto);
                adicionarMensagem("[Você]: " + texto, "propia");
                inputMsg.value = "";
            }
        }
    </script>
</body>
</html>
